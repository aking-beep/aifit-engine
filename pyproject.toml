[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aifit"
version = "0.4.0"
description = "Fit: everyday AI style quiz and installable setup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=2.3"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
aifit = "aifit.cli:app"

[tool.hatch.build.targets.wheel.force-include]
"packages/core/src/aifit" = "aifit"

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["packages/core/src"]

[tool.vercel]
entrypoint = "services.api.main:app"

[tool.pytest.ini_options]
pythonpath = ["packages/core/src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["packages/core/src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# FastAPI declares request bodies and headers via call defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The API puts the core package on sys.path before importing it.
"services/api/main.py" = ["E402"]
