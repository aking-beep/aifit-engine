name: CI
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check packages services tests evals
      - run: pytest
      - run: PYTHONPATH=packages/core/src python -m evals.harness validate-seed
      - run: PYTHONPATH=packages/core/src python -m evals.harness run-cases

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npx tsc --noEmit
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          API_ORIGIN: http://127.0.0.1:8472

  teams:
    # AI Fit Teams (apps/teams) and its packages: one npm workspace from the
    # repository-root package.json. apps/web is not part of it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The design system is vendored into both apps; a hand edit to a copy fails here.
      - run: node scripts/sync-design.mjs --check
      # Contract fixtures, teams-core (engine, calibration client), ui, then the app's own tests.
      - run: npm run test:teams
      - run: npm run typecheck:teams
      # No ARK_CONTROL_URL: the build must not need Control.
      - run: npm run build:teams

  teams-e2e:
    # Browser tests for AI Fit Teams against two production servers: billing
    # off, and Stripe test mode with fake keys (webhooks are signed locally;
    # nothing reaches Stripe). Each run uses throwaway file stores.
    runs-on: ubuntu-latest
    needs: [teams]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:teams
      - run: npx playwright install --with-deps chromium
        working-directory: apps/teams
      - run: npx playwright test
        working-directory: apps/teams
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: teams-playwright-report
          path: apps/teams/test-results

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          API_ORIGIN: http://127.0.0.1:8472
      - run: npx playwright test
        working-directory: apps/web
        env:
          API_ORIGIN: http://127.0.0.1:8472
          AIFIT_STORE: ${{ runner.temp }}/aifit-store
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
